name: qwen3-finetune
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # PyTorch with CUDA 12.1 (adjust cu121 to match your CUDA version)
      - torch==2.5.1
      - torchvision
      - torchaudio
      # Core training stack
      - transformers==4.51.3
      - peft==0.15.2
      - trl==0.15.2
      - accelerate==1.3.0
      - bitsandbytes==0.45.5
      # Unsloth for 2x faster QLoRA training
      - unsloth[colab-new]
      # HuggingFace utilities
      - huggingface_hub==0.30.2
      - datasets==3.5.0
      - tokenizers==0.21.1
      # Training utilities
      - safetensors==0.5.3
      - sentencepiece
      - protobuf
      # Experiment tracking (optional but recommended)
      - wandb
      # Utilities
      - tqdm
      - numpy
      - pandas
