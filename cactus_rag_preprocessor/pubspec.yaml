name: cactus_rag_preprocessor
description: CLI for preprocessing RAG documents into ObjectBox database
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # CRITICAL: Must match exact version from natural_farming_chat/pubspec.lock
  # for HNSW index binary compatibility between host CLI and mobile runtime
  objectbox: 5.0.4
  args: ^2.4.0
  path: ^1.8.0
  crypto: ^3.0.0
  http: ^1.2.0

dev_dependencies:
  build_runner: ^2.4.0
  objectbox_generator: 5.0.4
