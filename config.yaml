# Local LLM Configuration
llm:
  model_name: "Qwen/Qwen3-0.6B"  # Qwen 3 0.6B model (smaller, faster)
  device: "cuda"  # Use "cpu" if no GPU available
  load_in_4bit: false  # Disabled - 0.6B model is small enough without quantization
  load_in_8bit: false  # Disabled in favor of 4-bit
  max_length: 1024  # Reduced to save GPU memory
  temperature: 0.7
  
# Embedding Model Configuration
embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"  # Fast and efficient
  # Alternative: "BAAI/bge-small-en-v1.5" (better quality)
  device: "cpu"  # Moved to CPU to free GPU memory for LLM

# Vector Store Configuration
vector_store:
  type: "chroma"
  persist_directory: "./vector_store"
  collection_name: "farming_docs"
  
# Chunking Configuration
chunking:
  chunk_size: 1000
  chunk_overlap: 200
  
# Retrieval Configuration
retrieval:
  top_k: 3
  similarity_threshold: 0.7

# User Input Configuration
user_input:
  max_prompt_length: 500  # Maximum characters for user prompt

# System Prompt
master_prompt: |
  You are a helpful farming assistant specializing in natural farming practices.
  Answer questions based on the provided context. If you don't know the answer,
  say so honestly. Provide practical, actionable advice when possible.